name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm dibaca dari "packageManager" di package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint sengaja tidak dijalankan: typescript-eslint belum mendukung TypeScript 7.
      - run: pnpm check:content
      - run: pnpm typecheck
      # Build juga memvalidasi frontmatter dan referensi antarpelajaran.
      - run: pnpm build
